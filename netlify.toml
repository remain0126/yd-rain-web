[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 5분마다 짧은 예약 함수가 Background Function을 호출한다.
[functions."scheduled-refresh"]
  schedule = "*/5 * * * *"

# 영덕군청 수집은 느릴 수 있으므로 백그라운드 실행.
[functions."refresh-background"]
  background = true

# 감시(watch)가 살아 있는지 5분마다 확인한다.
# 외부 스케줄러(cron-job.org)가 죽어도 이쪽이 받는다.
[functions."watchdog"]
  schedule = "*/5 * * * *"

[[redirects]]
  from = "/api/rainfall"
  to = "/.netlify/functions/rainfall"
  status = 200

[[redirects]]
  from = "/api/diag"
  to = "/.netlify/functions/diag"
  status = 200

[[redirects]]
  from = "/api/warning"
  to = "/.netlify/functions/warning"
  status = 200

[[redirects]]
  from = "/api/watch"
  to = "/.netlify/functions/watch"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/watchdog"
  status = 200

[[redirects]]
  from = "/api/logs"
  to = "/.netlify/functions/logs"
  status = 200

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
