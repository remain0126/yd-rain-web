[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 5분마다 짧은 예약 함수가 Background Function을 호출한다.
[functions."scheduled-refresh"]
  schedule = "*/5 * * * *"

# 영덕군청 수집은 느릴 수 있으므로 백그라운드 실행.
[functions."refresh-background"]
  background = true

[[redirects]]
  from = "/api/rainfall"
  to = "/.netlify/functions/rainfall"
  status = 200

[[redirects]]
  from = "/api/diag"
  to = "/.netlify/functions/diag"
  status = 200

[[redirects]]
  from = "/api/warning"
  to = "/.netlify/functions/warning"
  status = 200

[[redirects]]
  from = "/api/push"
  to = "/.netlify/functions/push"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
