[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 사용자 접속 함수: 빠른 응답 (저장된 스냅샷만 읽으므로 짧아도 됨)
[functions.rainfall]
  timeout = 10

[functions.diag]
  timeout = 10

# scheduled-refresh-background 는 파일명에 -background 가 붙어
# 자동으로 백그라운드 함수(최대 15분)로 동작하므로 별도 timeout 설정 불필요.

[[redirects]]
  from = "/api/rainfall"
  to = "/.netlify/functions/rainfall"
  status = 200

[[redirects]]
  from = "/api/diag"
  to = "/.netlify/functions/diag"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
